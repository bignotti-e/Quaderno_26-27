<html>
    <head>
        <title>SPA gatti</title>
        <style>
            body{
                text-align: center;
                padding: 20px;
            }

            img{
                height: 550px;
            }

            button{
                padding: 5px;
                margin: 20px;
                background-color: powderblue;
                border: 1px solid black;
                border-radius: 3px;
                font-size: 20px;
                
            }

            #gatti-salvati{
                border: 5px solid black;
                padding: 20px;

                display: flex;
                flex-wrap: wrap;
            }

            #gatti-salvati img{
                margin: 5px;
                height: 100px;
            }
        </style>
    </head>

    <body>
        <div>
            <button id="nuovo-gatto">Nuovo gatto</button>
            <button id="salva-gatto">Salva gatto</button>
            <img id="gatto-img" src="" alt="">
        </div>

            <img id="gatti-salvati" src="" alt="">

        <script>
            const imgTag = document.getElementById("gatto-img");
            const bottone = document.getElementById("nuovo-gatto");
            bottone.addEventListener("click", () => getCat())
            const gattiSalvati = document.getElementById("gatti-salvati")

            const salva = document.getElementById("salva-gatto");
            salva.addEventListener("click", () => {
                const newImg = document.createElement("img");
                newImg.src = imgTag.src;
                gattiSalvati.appendChild(newImg);
            });

            async function getCat() {
                const url = "https://cataas.com/cat?json=true";
                try {
                    const response = await fetch(url); //manda una richiesta HTTP GET all'url
                    console.log("RISPOSTA",response);
                    const data = await response.json(); //estrae i dati JSON dalla risposta
                    console.log("DATI",data.url);
                    imgTag.src = data.url;
                } catch(e){
                    console.log("ERRORE",e.message);
                }
            }
            getCat();
        </script>
    </body>
</html>
